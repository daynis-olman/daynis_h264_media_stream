name: daynis_h264_media_stream
description: >-
  Play live H.264 video streamed over HTTP (multipart/x-mixed-replace or raw
  Annex-B) in Flutter web with WebCodecs or Media Source Extensions, no JS.
version: 1.0.1
homepage: https://github.com/daynis-olman/daynis_h264_media_stream
repository: https://github.com/daynis-olman/daynis_h264_media_stream
issue_tracker: https://github.com/daynis-olman/daynis_h264_media_stream/issues
topics:
  - video
  - h264
  - streaming
  - web
  - mse

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

platforms:
  web:

dependencies:
  flutter:
    sdk: flutter
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

screenshots:
  - description: Example app playing a live multipart H.264 stream with telemetry.
    path: doc/screenshot.png
